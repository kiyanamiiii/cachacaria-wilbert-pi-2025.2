<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="icon" type="image/png" href="/assets/images/carta-do-coletor-de-elixir-rara-elixir-collector.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cachaçaria Wilbert</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="/pages/styles/index.css" />
    <link rel="stylesheet" href="/models/styles/common.css" />
  </head>

  <body>
    <div id="page-container">
      <div id="content-wrap">
        <div id="header-container"></div>

        <div
          id="carouselExampleInterval"
          class="carousel slide"
          data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
              aria-label="Slide 1"></button>
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="1"
              aria-label="Slide 2"></button>
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="2"
              aria-label="Slide 3"></button>
          </div>

          <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="3000">
              <img
                src="https://placehold.co/1920x500"
                class="d-block w-100"
                alt="banner1" />
            </div>
            <div class="carousel-item" data-bs-interval="3000">
              <img
                src="https://placehold.co/1920x500"
                class="d-block w-100"
                alt="banner2" />
            </div>
            <div class="carousel-item" data-bs-interval="3000">
              <img
                src="https://placehold.co/1920x500"
                class="d-block w-100"
                alt="banner3" />
            </div>
          </div>

          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleInterval"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleInterval"
            data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Próximo</span>
          </button>
        </div>

        <section class="container my-5">
          <h2 class="text-center mb-4">Nossos Produtos</h2>
          <div class="row" id="product-list">
          </div>
        </section>
      </div>

      <div id="footer-container"></div>
    </div>

    <!-- JS -->
    <script type="module" src="/javascript/load-component.js" defer></script>
    <script type="module" src="/javascript/get-products.js" defer></script>
    <script type="module" src="/javascript/home-products.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
