<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cachaçaria Wilbert</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/css/style-index.css" />
    <script src="/assets/js/index.js" defer></script>
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <div style="display: flex; justify-content: center; align-items: center">
        <img
          src="https://placehold.co/70"
          alt="logo-cachacaria"
          class="logo-cachacaria"
        />
        <h1>Cachaçaria Wilbert</h1>
      </div>

      <!-- Botão sidebar -->
      <div class="container-button-header">
        <button
          class="menu-button"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasWithBothOptions"
          aria-controls="offcanvasWithBothOptions"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 16 16"
            style="width: 2em; height: 2em; color: black"
          >
            <path
              fill-rule="evenodd"
              d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
            />
          </svg>
        </button>
      </div>

      <!-- Sidebar -->
      <div
        class="offcanvas offcanvas-start"
        data-bs-scroll="false"
        tabindex="-1"
        id="offcanvasWithBothOptions"
        aria-labelledby="offcanvasWithBothOptionsLabel"
      >
        <div class="offcanvas-header">
          <p class="offcanvas-title" id="offcanvasWithBothOptionsLabel">Menu</p>
        </div>
        <div class="offcanvas-body">
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 10px;
              justify-content: center;
              align-items: center;
            "
          >
            <div class="container-sidebar">
              <a href="/index.html">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                  style="width: 1.5em; height: 1.5em; color: black"
                >
                  <path
                    d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"
                  />
                  <path
                    d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"
                  />
                </svg>
                Home
              </a>
            </div>
            <div class="container-sidebar">
              <a href="produtos.html">
                <img
                  src="/assets/icons/bottle.png"
                  alt=""
                  style="width: 1.5em; height: 1.5em"
                />
                Produtos
              </a>
            </div>
            <div class="container-sidebar">
              <a href="/sobre.html">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                  style="width: 1.5em; height: 1.5em; color: black"
                >
                  <path
                    d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
                  />
                  <path
                    d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"
                  />
                </svg>
                Sobre
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Seção produtos e afins -->
    <!-- Carrossel -->
    <div
      id="carouselExampleInterval"
      class="carousel slide"
      data-bs-ride="carousel"
    >
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide-to="0"
          class="active"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide-to="1"
          aria-label="Slide 2"
        ></button>
        <button
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide-to="2"
          aria-label="Slide 3"
        ></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="5000">
          <img
            src="https://placehold.co/1920x500"
            class="d-block w-100"
            alt="banner1"
          />
        </div>
        <div class="carousel-item" data-bs-interval="2500">
          <img
            src="https://placehold.co/1920x500"
            class="d-block w-100"
            alt="banner2"
          />
        </div>
        <div class="carousel-item">
          <img
            src="https://placehold.co/1920x500"
            class="d-block w-100"
            alt="banner3"
          />
        </div>
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselExampleInterval"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselExampleInterval"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <!-- Produtos -->
    <section class="product-section">
      <div class="product-container">
        <div class="product">
          <div class="card product-card">
            <div class="product-image-div">
              <a href="/produto.html">
                <img
                  src="https://placehold.co/300x300"
                  alt=""
                  class="card-img-top product-image"
                />
              </a>
            </div>
            <div class="card-body product-body">
              <h5 class="card-title product-title">[Produto 1]</h5>
              <p class="card-text product-text">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam
                enim possimus vel, ea non delectus et cum quasi quas incidunt
                fugit fuga doloribus vitae quod dolorum ducimus, ab eum cumque.
              </p>
              <div
                style="
                  display: flex;
                  justify-content: center;
                  align-items: center;
                "
              >
                <button class="btn-primary product-button">
                  <a href="/produto.html" style="color: white">Ver Produto</a>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button
        id="add-product-btn"
        class="btn btn-primary"
        style="margin: 20px auto; display: block"
      >
        Adicionar Produto
      </button>
    </section>

    <!-- FOOTER -->
    <footer>
      <div>
        <p>&copy; [Texto Placeholder]</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
