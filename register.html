<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro - Cachaçaria Wilbert</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- Project CSS -->
    <link rel="stylesheet" href="/assets/css/components/common.css" />
    <link rel="stylesheet" href="/assets/css//components/header.css" />
    <link rel="stylesheet" href="/assets/css//components/footer.css" />
    <link rel="stylesheet" href="/assets/css//components/auth.css" />
  </head>
  <body>
    <!-- header (carregado via load-components.js) -->
    <div id="header-container"></div>

    <main class="page-container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="h5 mb-3 text-center">Criar conta</h2>

              <form id="register-form">
                <!-- email -->
                <div class="mb-3">
                  <label for="regEmail" class="form-label">E-mail</label>
                  <input
                    id="regEmail"
                    name="email"
                    type="email"
                    class="form-control"
                    placeholder="seu@exemplo.com"
                  />
                </div>

                <!-- senha com show/hide -->
                <div class="mb-3">
                  <label for="regPassword" class="form-label">Senha</label>
                  <div class="input-group">
                    <input
                      id="regPassword"
                      name="password"
                      type="password"
                      class="form-control"
                      placeholder="Mínimo 8 caracteres"
                      minlength="8"
                    />
                    <button
                      class="btn btn-outline-secondary toggle-password"
                      type="button"
                      data-target="#regPassword"
                      aria-label="Mostrar senha"
                    >
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- telefone -->
                <div class="mb-3">
                  <label for="regPhone" class="form-label">Telefone</label>
                  <input
                    id="regPhone"
                    name="phone"
                    type="tel"
                    class="form-control"
                    placeholder="(11) 91234-5678"
                    pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}"
                  />
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary">
                    Registrar
                  </button>
                </div>

                <p class="text-center mt-3 mb-0 small">
                  Já tem conta? <a href="login.html">Entrar</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- footer (carregado via js) -->
    <div id="footer-container"></div>

    <!-- existing: header/footer loader (if any) -->
    <script src="/assets/js/load-component.js"></script>

    <!-- Bootstrap bundle (REQUIRED before modalHelper uses it) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- our small scripts -->
    <script src="/assets/js/modal.js"></script>
    <script src="/assets/js/show-password.js"></script>
    <script src="/assets/js/auth-handlers.js"></script>
  </body>
</html>
