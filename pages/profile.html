<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil — Cachaçaria Wilbert</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/models/styles/common.css" />
    <link rel="stylesheet" href="/pages/styles/profile.css" />
    <style>
      /* ajustes locais mínimos para garantir centralização limpa */
      .profile-wrap {
        display: flex;
        justify-content: center;
        padding: 48px 16px;
      }
      .profile-card {
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      .profile-avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 0 auto 16px;
      }
      .profile-list {
        list-style: none;
        padding: 0;
        margin: 0 0 16px;
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .profile-list li {
        padding: 6px 12px;
        border-radius: 8px;
        background: #f8f9fa;
        font-size: 0.95rem;
      }
      .profile-form .form-control {
        max-width: 420px;
        margin: 6px auto;
      }
    </style>
  </head>

  <body>
    <div id="page-container">
      <div id="content-wrap">
        <div id="header-container"></div>

        <main class="page-container">
          <div class="profile-wrap">
            <div class="profile-card card shadow-sm p-4">
              <img
                src="https://placehold.co/200x200"
                alt="avatar"
                class="profile-avatar"
                id="profile-avatar"
              />

              <hr />

              <div class="profile-details mb-3">
                <!-- Campos editáveis para o usuário -->
                <form id="profile-form" class="profile-form text-center">
                  <div class="mb-2">
                    <label for="name" class="form-label visually-hidden"
                      >Nome</label
                    >
                    <input
                      id="name"
                      name="name"
                      type="text"
                      class="form-control"
                      placeholder="Nome"
                    />
                  </div>

                  <div class="mb-2">
                    <label for="email" class="form-label visually-hidden"
                      >E-mail</label
                    >
                    <input
                      id="email"
                      name="email"
                      type="email"
                      class="form-control"
                      placeholder="E-mail"
                    />
                  </div>

                  <div class="mb-2">
                    <label for="phone" class="form-label visually-hidden"
                      >Telefone</label
                    >
                    <input
                      id="phone"
                      name="phone"
                      type="tel"
                      class="form-control"
                      placeholder="Telefone"
                    />
                  </div>

                  <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary">
                      Salvar alterações
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </main>
      </div>

      <div id="footer-container"></div>
    </div>

    <script type="module" src="/javascript/load-component.js" defer></script>
    <script type="module" src="/javascript/header-auth-check.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
