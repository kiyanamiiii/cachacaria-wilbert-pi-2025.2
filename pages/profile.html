<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cachaçaria Wilbert</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="/models/styles/common.css" />
  <link rel="stylesheet" href="/pages/styles/profile.css" />

  <style>
    /* Ensures icons match input height perfectly */
    .input-group-text i {
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="header-container"></div>

  <!-- Main Content -->
  <div class="main-content p-4">
    <h2>Perfil</h2>

    <form class="mt-4">

  <form>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="Ex: fulano@email.com" />
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">Telefone</label>
      <input type="text" class="form-control" id="phone" placeholder="Ex: (47) 99999-9999" />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Senha</label>
      <input type="text" class="form-control" id="password" placeholder="Ex: °°°°°°°°°°°°" />
    </div>
    <button type="submit" class="btn btn-primary">Salvar mudanças</button>
    <button id="logout-button" type="button" class="btn btn-danger">Sair</button>
  </form>
</div>

  <div id="footer-container"></div>

  <!-- JS -->
  <script type="module" src="/javascript/load-component.js" defer></script> 
  <script type="module" src="/javascript/get-profile.js" defer></script>
  <script type="module" src="/javascript/logout.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
</body>
</html>
