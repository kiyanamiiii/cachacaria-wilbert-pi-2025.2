<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho — Cachaçaria Wilbert</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="/models/styles/common.css" />
    <link rel="stylesheet" href="/pages/styles/cart.css" />
  </head>

  <body>
    <div id="page-container">
      <div id="content-wrap">
        <div id="header-container"></div>

        <main class="container my-4">
          <section class="carrinho text-center mb-4">
            <h2 class="mb-0">Carrinho</h2>
            <small class="text-muted"
              >Confira os itens antes de finalizar a compra</small
            >
          </section>

          <div class="row g-4">
            <!-- Produtos -->
            <section class="col-12 col-lg-8" id="cart-products">
              <!-- Exemplo de produto (JS deve popular este container) -->
              <div
                class="card mb-3 shadow-sm cart-item d-flex align-items-center p-3"
              >
                <div class="d-flex align-items-center w-100 gap-3">
                  <img
                    src="https://placehold.co/100x100"
                    alt="produto"
                    class="img-thumbnail"
                    style="width: 100px; height: 100px; object-fit: cover"
                  />
                  <div class="flex-grow-1">
                    <h5 class="mb-1">Produto Exemplo</h5>
                    <p class="mb-1 text-muted">Descrição curta ou SKU</p>
                    <div class="d-flex align-items-center gap-3">
                      <small class="text-muted"
                        >R$ <span class="item-price">59.90</span></small
                      >

                      <div class="input-group input-group-sm w-auto">
                        <button
                          class="btn btn-outline-secondary decrease-qty"
                          type="button"
                        >
                          -
                        </button>
                        <input
                          type="number"
                          class="form-control qty-input"
                          value="1"
                          min="1"
                          style="width: 64px; text-align: center"
                        />
                        <button
                          class="btn btn-outline-secondary increase-qty"
                          type="button"
                        >
                          +
                        </button>
                      </div>

                      <div class="ms-auto text-end">
                        <div class="fw-semibold">
                          R$ <span class="item-subtotal">59.90</span>
                        </div>
                        <button
                          class="btn btn-outline-danger btn-sm mt-2 remove-item"
                        >
                          <i class="bi bi-trash"></i> Remover
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Quando o carrinho estiver vazio -->
              <div class="text-center text-muted mt-3 empty-cart-note">
                Carrinho vazio? Continue explorando.
              </div>

              <div class="text-center mt-3">
                <button
                  class="btn btn-primary"
                  onclick="window.location.href='/index.html'"
                >
                  Ver produtos
                </button>
              </div>
            </section>

            <!-- Resumo -->
            <aside class="col-12 col-lg-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h5 class="card-title mb-3">Resumo do pedido</h5>
                  <ul class="list-unstyled mb-3">
                    <li class="d-flex justify-content-between">
                      <span>Itens</span><strong id="summary-items">1</strong>
                    </li>
                    <li class="d-flex justify-content-between">
                      <span>Subtotal</span
                      ><strong id="summary-subtotal">R$ 00.00</strong>
                    </li>
                  </ul>

                  <div
                    class="border-top pt-3 d-flex justify-content-between align-items-center"
                  >
                    <div>
                      <small class="text-muted">Total estimado</small>
                      <div class="h5 mb-0" id="summary-total">R$ 59.90</div>
                    </div>
                    <button class="btn btn-success" id="checkout-btn">
                      Continuar
                    </button>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </main>
      </div>

      <!-- footer-container deve ficar FORA do content-wrap -->
      <div id="footer-container"></div>
    </div>

    <script type="module" src="/javascript/load-component.js" defer></script>
    <script type="module" src="/javascript/cart.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
