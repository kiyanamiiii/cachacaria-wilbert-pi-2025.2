<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="icon" type="image/png"
      href="/assets/images/carta-do-coletor-de-elixir-rara-elixir-collector.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    <!-- JS -->
    <script type="module" src="/javascript/load-component.js" defer></script>
