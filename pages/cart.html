<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho</title>

    <!-- CSS do Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Ícones do Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="/models/styles/common.css" />
    <link rel="stylesheet" href="/pages/styles/cart.css" />
  </head>

  <body>
    <div id="header-container"></div>

    <div class="container">
      <!-- Seção do carrinho -->
      <section class="carrinho text-center my-4">
        <h2>Carrinho</h2>
      </section>

      <!-- Produtos no carrinho -->
      <section class="produtos" id="cart-products">
        <!-- Exemplo de produto no carrinho -->
        <div
          class="card mb-3 shadow-sm p-3 d-flex flex-row justify-content-between align-items-center"
        >
          <div>
            <h5 class="mb-1">Produto Exemplo</h5>
            <p class="mb-0 text-muted">R$ 59,90</p>
          </div>

          <button class="btn btn-outline-danger btn-sm">
            <i class="bi bi-trash"></i> Excluir
          </button>
        </div>

        <!-- Quando o carrinho estiver vazio -->
        <p class="text-center text-muted mt-3">
          Carrinho vazio? Continue explorando
        </p>
        <div class="text-center">
          <button
            class="btn btn-primary"
            onclick="window.location.href='/index.html'"
          >
            Acessar
          </button>
        </div>
      </section>

      <!-- Resumo e preço -->
      <section
        class="preco border-top pt-3 mt-4 d-flex flex-column align-items-center"
      >
        <div class="text-center mb-3">
          <h2>Resumo</h2>
          <p>Estimativa total: R$ 59,90</p>
        </div>
        <button class="btn btn-success w-50">
          Continuar (1)
        </button>
      </section>
    </div>

    <div id="footer-container"></div>

    <script src="/javascript/load-component.js" defer></script>
    <script type="module" src="/javascript/cart.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
