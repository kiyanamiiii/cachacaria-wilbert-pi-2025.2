<!DOCTYPE html>

    <link rel="stylesheet" href="/models/styles/common.css" />

  <body>
    <div id="header-container"></div>

    <div class="container">
      <!-- Seção do carrinho -->
      <section class="carrinho">
        <h2>Carrinho</h2>
      </section>

      <section class="produtos" id="cart-products">
        <p>Carrinho vazio? Continue explorando</p>
        <button onclick="window.location.href='/index.html'">Acessar</button>
      </section>

      <!-- Resumo e preço -->
      <section class="preco">
        <div>
          <h2>Resumo</h2>
          <p>Estimativa total: R$ 0,00</p>
        </div>
        <button>Continuar (0)</button>
      </section>
    </div>

    <div id="footer-container"></div>

    <script src="/javascript/load-component.js" defer></script>
    <script src="/javascript/cart.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
