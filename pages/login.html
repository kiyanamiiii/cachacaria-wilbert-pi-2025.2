<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Cachaçaria Wilbert</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- Project CSS -->
    <link rel="stylesheet" href="/models/styles/common.css" />
    <link rel="stylesheet" href="/models/styles/auth.css" />
  </head>
  <body>
    <div id="page-container">
      <div id="content-wrap">
        <!-- Header -->
        <div id="header-container"></div>

        <main class="page-container my-5">
          <div class="row justify-content-md-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-6">
              <div class="card shadow-sm">
                <div class="card-body p-4">
                  <h2 class="h5 mb-3 text-center">Entrar</h2>

                  <form id="login-form">
                    <div class="mb-3">
                      <label for="loginEmail" class="form-label">E-mail</label>
                      <input
                        id="loginEmail"
                        name="email"
                        type="email"
                        class="form-control"
                        placeholder="seu@exemplo.com"
                      />
                    </div>

                    <div class="mb-3">
                      <label for="loginPassword" class="form-label"
                        >Senha</label
                      >
                      <div class="input-group">
                        <input
                          id="loginPassword"
                          name="password"
                          type="password"
                          class="form-control"
                          placeholder="Sua senha"
                        />
                        <button
                          class="btn btn-outline-secondary toggle-password"
                          type="button"
                          data-target="#loginPassword"
                          aria-label="Mostrar senha"
                        >
                          <i class="bi bi-eye"></i>
                        </button>
                      </div>
                    </div>

                    <!-- ✅ Feedback de login -->
                    <div
                      id="login-feedback"
                      class="form-text text-danger mb-3"
                    ></div>

                    <div class="text-center">
                      <button type="submit" class="btn btn-primary">
                        Entrar
                      </button>
                    </div>

                    <p class="text-center mt-3 mb-0 small">
                      Não tem conta? <a href="register.html">Crie uma</a>
                    </p>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </main>

        <!-- Footer -->
        <div id="footer-container"></div>

        <!-- Scripts -->
        <script src="/javascript/load-component.js" defer></script>
        <script src="/javascript/show-password.js" defer></script>
        <script type="module" src="/javascript/auth-handlers.js" defer></script>
        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
          crossorigin="anonymous"
        ></script>
      </div>
    </div>
  </body>
</html>
