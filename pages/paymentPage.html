<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento | Marketplace</title>

    <link rel="stylesheet" href="/models/styles/common.css" />
    <link rel="stylesheet" href="styles/paymentPage.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div id="page-container">
      <div id="content-wrap">
        <div id="header-container"></div>

        <main class="checkout-wrapper">
          <div class="checkout-container">
            <div class="payment-box">
              <h2>Pagamento</h2>

              <!-- Métodos -->
              <div class="methods">
                <input type="radio" id="cartao" name="metodo" checked />
                <label for="cartao">
                  <i class="bi bi-credit-card-2-back-fill"></i>
                  Cartão
                </label>

                <input type="radio" id="boleto" name="metodo" />
                <label for="boleto">
                  <i class="bi bi-upc"></i>
                  Boleto
                </label>

                <input type="radio" id="pix" name="metodo" />
                <label for="pix">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    x="0px"
                    y="0px"
                    width="40"
                    height="40"
                    viewBox="0 0 48 48"
                  >
                    <path
                      fill="#4db6ac"
                      d="M11.9,12h-0.68l8.04-8.04c2.62-2.61,6.86-2.61,9.48,0L36.78,12H36.1c-1.6,0-3.11,0.62-4.24,1.76 l-6.8,6.77c-0.59,0.59-1.53,0.59-2.12,0l-6.8-6.77C15.01,12.62,13.5,12,11.9,12z"
                    ></path>
                    <path
                      fill="#4db6ac"
                      d="M36.1,36h0.68l-8.04,8.04c-2.62,2.61-6.86,2.61-9.48,0L11.22,36h0.68c1.6,0,3.11-0.62,4.24-1.76 l6.8-6.77c0.59-0.59,1.53-0.59,2.12,0l6.8,6.77C32.99,35.38,34.5,36,36.1,36z"
                    ></path>
                    <path
                      fill="#4db6ac"
                      d="M44.04,28.74L38.78,34H36.1c-1.07,0-2.07-0.42-2.83-1.17l-6.8-6.78c-1.36-1.36-3.58-1.36-4.94,0 l-6.8,6.78C13.97,33.58,12.97,34,11.9,34H9.22l-5.26-5.26c-2.61-2.62-2.61-6.86,0-9.48L9.22,14h2.68c1.07,0,2.07,0.42,2.83,1.17 l6.8,6.78c0.68,0.68,1.58,1.02,2.47,1.02s1.79-0.34,2.47-1.02l6.8-6.78C34.03,14.42,35.03,14,36.1,14h2.68l5.26,5.26 C46.65,21.88,46.65,26.12,44.04,28.74z"
                    ></path>
                  </svg>
                  Pix
                </label>
              </div>

              <!-- Cartão -->
              <div id="form-cartao" class="form-section">
                <input type="text" placeholder="Número do cartão" />
                <div style="display: flex; gap: 10px">
                  <input
                    type="text"
                    placeholder="Validade (MM/AA)"
                    style="flex: 1"
                  />
                  <input type="text" placeholder="CVV" style="flex: 1" />
                </div>
                <input type="text" placeholder="Nome no cartão" />
                <button>Confirmar pagamento</button>
              </div>

              <!-- Boleto -->
              <div id="form-boleto" class="form-section" style="display: none">
                <p style="text-align: center; color: #555; margin-bottom: 20px">
                  Clique abaixo para gerar o boleto bancário.
                </p>
                <button style="background: #ff9800">Gerar Boleto</button>
              </div>

              <!-- Pix -->
              <div id="form-pix" class="form-section" style="display: none">
                <p style="text-align: center; color: #555; margin-bottom: 20px">
                  Escaneie o QR Code abaixo ou copie o código Pix para pagar.
                </p>
                <img
                  src="/assets/images/Qeu0Cc.svg"
                  alt="Pix"
                  style="width: 300px; display: block; margin: 10px auto"
                />
                <button style="background: #4caf50">Copiar código Pix</button>
              </div>
            </div>

            <!-- Resumo -->
            <div class="summary-box">
              <h3>Resumo da compra</h3>
              <ul></ul>
              <p class="total">Total:</p>
            </div>
          </div>
        </main>
      </div>

      <div id="footer-container"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const radios = document.querySelectorAll('input[name="metodo"]');
        const sections = document.querySelectorAll(".form-section");

        radios.forEach((radio) => {
          radio.addEventListener("change", () => {
            sections.forEach((section) => (section.style.display = "none"));
            const target = document.querySelector(`#form-${radio.id}`);
            if (target) target.style.display = "block";
          });
        });
      });
    </script>

    <script type="module" src="/javascript/payment-summary.js" defer></script>
    <script type="module" src="/javascript/load-component.js" defer></script>
  </body>
</html>
