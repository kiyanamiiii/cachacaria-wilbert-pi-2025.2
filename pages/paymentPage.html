<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento | Marketplace</title>

  <!-- ✅ Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
    }

    .checkout-container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      max-width: 1100px;
      width: 100%;
    }

    .payment-box {
      background: #fff;
      padding: 30px;
      width: 420px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .payment-box h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    .methods {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .methods label {
      flex: 1;
      background: #f2f2f2;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      margin: 0 5px;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .methods label i {
      font-size: 22px;
      color: #555;
    }

    .methods input[type="radio"] {
      display: none;
    }

    .methods input[type="radio"]:checked + label {
      background: #e8f5e9;
      border-color: #4CAF50;
      font-weight: bold;
    }

    .form-section {
      display: none;
    }

    input[type="radio"][id="cartao"]:checked ~ #form-cartao,
    input[type="radio"][id="boleto"]:checked ~ #form-boleto,
    input[type="radio"][id="pix"]:checked ~ #form-pix {
      display: block;
    }

    .form-section input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .form-section button {
      width: 100%;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .form-section button:hover {
      background: #45a049;
    }

    .summary-box {
      background: #fff;
      padding: 30px;
      flex: 1;
      min-width: 300px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .summary-box h3 {
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      color: #333;
    }

    .summary-box ul {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
    }

    .summary-box li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #555;
    }

    .summary-box .total {
      font-weight: bold;
      font-size: 18px;
      color: #2e7d32;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      .checkout-container {
        flex-direction: column;
        align-items: center;
      }
      .payment-box, .summary-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="checkout-container">

    <div class="payment-box">
      <h2>Pagamento</h2>

      <!-- Métodos -->
      <div class="methods">
        <input type="radio" id="cartao" name="metodo" checked>
        <label for="cartao">
          <i class="bi bi-credit-card-2-back-fill"></i>
          Cartão
        </label>

        <input type="radio" id="boleto" name="metodo">
        <label for="boleto">
          <i class="bi bi-upc"></i>
          Boleto
        </label>

        <input type="radio" id="pix" name="metodo">
        <label for="pix">
          <img src="\images\pix_icon_198027.png" alt="pixIcon">
          Pix
        </label>
      </div>

      <!-- Cartão -->
      <div id="form-cartao" class="form-section">
        <input type="text" placeholder="Número do cartão">
        <div style="display:flex; gap:10px;">
          <input type="text" placeholder="Validade (MM/AA)" style="flex:1;">
          <input type="text" placeholder="CVV" style="flex:1;">
        </div>
        <input type="text" placeholder="Nome no cartão">
        <button>Confirmar pagamento</button>
      </div>

      <!-- Boleto -->
      <div id="form-boleto" class="form-section">
        <p style="text-align:center; color:#555; margin-bottom:20px;">
          Clique abaixo para gerar o boleto bancário.
        </p>
        <button style="background:#ff9800;">Gerar Boleto</button>
      </div>

      <!-- Pix -->
      <div id="form-pix" class="form-section">
        <p style="text-align:center; color:#555; margin-bottom:20px;">
          Escaneie o QR Code abaixo ou copie o código Pix para pagar.
        </p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Pix_logo_2021.svg" alt="Pix" style="width:100px; display:block; margin:10px auto;">
        <button style="background:#4caf50;">Copiar código Pix</button>
      </div>
    </div>

    <!-- Resumo -->
    <div class="summary-box">
      <h3>Resumo da compra</h3>
      <ul>
        <li><span>Produto A</span> <span>R$ 80,00</span></li>
        <li><span>Produto B</span> <span>R$ 120,00</span></li>
        <li><span>Frete</span> <span>R$ 15,00</span></li>
      </ul>
      <p class="total">Total: R$ 215,00</p>
    </div>

  </div>

  <script>
    // Alternância dos formulários
    const radios = document.querySelectorAll('input[name="metodo"]');
    const sections = document.querySelectorAll('.form-section');

    radios.forEach(radio => {
      radio.addEventListener('change', () => {
        sections.forEach(section => section.style.display = 'none');
        document.querySelector(`#form-${radio.id}`).style.display = 'block';
      });
    });
  </script>
</body>
</html>
