<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link
      rel="icon"
      type="image/png"
      href="/assets/icons/logo.png"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adicionar Produto</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="/models/styles/common.css" />
    <link rel="stylesheet" href="/pages/styles/addProductForm.css" />
    <link rel="stylesheet" href="/models/styles/productCard.css" />
  </head>

  <body>
    <div id="page-container">
      <div id="content-wrap">
        <div id="header-container"></div>

        <main>
          <div class="container mt-5">
            <h2>Adicionar Produto</h2>

            <form id="addProductForm" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="productName" class="form-label"
                  >Nome do Produto</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="productName"
                  name="name"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="productDescription" class="form-label"
                  >Descrição</label
                >
                <textarea
                  class="form-control"
                  id="productDescription"
                  name="description"
                  rows="3"
                  required
                ></textarea>
              </div>

              <div class="mb-3">
                <label for="productStock" class="form-label">Estoque</label>
                <input
                  type="number"
                  class="form-control"
                  id="productStock"
                  name="stock"
                  step="0.01"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="productPrice" class="form-label">Preço</label>
                <input
                  type="number"
                  class="form-control"
                  id="productPrice"
                  name="price"
                  step="0.01"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="productImage" class="form-label">Imagem</label>
                <input
                  type="file"
                  class="form-control"
                  id="productImage"
                  name="photos"
                  accept="image/*"
                  multiple
                  required
                />
              </div>

              <button id="submit-btn" type="submit" class="btn btn-primary">
                Adicionar
              </button>
            </form>

            <div id="formResult" class="mt-3"></div>
          </div>

          <div class="mt-5 container-preview">
            <h4 class="text-center">Pré-visualização do Produto</h4>

            <div
              class="d-flex flex-column align-items-center"
              style="gap: 2rem; margin-bottom: 4rem"
            >
              <div class="card mb-3 img-transition" style="max-width: 540px">
                <div class="row g-0">
                  <div class="col-md-4">
                    <img
                      id="previewImage"
                      src="https://placehold.co/1000x1000"
                      class="img-fluid rounded-start"
                      alt="preview"
                    />
                  </div>

                  <div class="col-md-8">
                    <div class="card-body">
                      <h5 class="card-title" id="previewName">[Name]</h5>
                      <p class="card-text" id="previewDescription">[Desc...]</p>
                      <p class="card-text">
                        <small class="text-muted" id="previewPrice"
                          >R$0.00</small
                        >
                      </p>
                      <p class="card-text">
                        <small class="text-muted"
                          >Estoque: <span id="previewStock">0</span></small
                        >
                      </p>
                    </div>

                    <div class="buy-container">
                      <button class="buy-btn"></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>

      <!-- footer-container deve ficar FORA do content-wrap -->
      <div id="footer-container"></div>
    </div>

    <script type="module" src="/javascript/load-component.js" defer></script>
    <script type="module" src="/javascript/add-product.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
