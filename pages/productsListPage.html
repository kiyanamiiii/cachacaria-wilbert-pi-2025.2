<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="icon"
      type="image/png"
      href="/assets/icons/logo.png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos</title>

    <link rel="stylesheet" href="/models/styles/common.css" />
    <link rel="stylesheet" href="/pages/styles/productListPage.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>

  <body>
    <div id="page-container">
      <div id="content-wrap">
        <div id="header-container"></div>

        <main class="page-container">
          <div class="general-container">
            <div class="container">
              <div class="row justify-content-center">
                <div class="col-12 col-md-8">
                  <div class="search-bar my-4">
                    <div class="input-group">
                      <input
                        type="text"
                        id="search-input"
                        class="form-control"
                        placeholder="Buscar..."
                      />
                    </div>
                  </div>
                </div>
              </div>

              <section class="my-4">
                <h2 class="text-center mb-4">Nossos Produtos</h2>
                <div
                  class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4"
                  id="product-list"
                >
                  <!-- Produtos da API aparecerão aqui -->
                </div>

                <!-- Paginação -->
                <nav aria-label="Navegação de páginas" class="mt-4">
                  <ul
                    class="pagination justify-content-center"
                    id="pagination"
                  ></ul>
                </nav>
              </section>
            </div>
          </div>
        </main>
      </div>

      <!-- footer deve ficar fora do content-wrap -->
      <div id="footer-container"></div>
    </div>

    <script type="module" src="/javascript/load-component.js" defer></script>
    <script type="module" src="/javascript/home-products.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
